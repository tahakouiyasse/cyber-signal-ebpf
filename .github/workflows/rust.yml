name: CYBER-SIGNAL-eBPF CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-and-test:
    name: Critical Path Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install System Dependencies (Aya & BPF Tooling)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          linux-headers-$(uname -r) \
          build-essential \
          libelf-dev \
          pkg-config \
          clang \
          llvm \
          linux-tools-common \
          linux-tools-generic

    - name: Load Pinned Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-05-10
        targets: x86_64-unknown-linux-gnu
        components: rust-src, rustfmt, clippy, llvm-tools-preview

    - name: Install bpf-linker
      run: |
        echo "=== Installing cargo-binstall (pinned release) ==="
        curl -sSfL \
          https://github.com/cargo-bins/cargo-binstall/releases/download/v1.6.9/cargo-binstall-x86_64-unknown-linux-gnu.tgz \
          | tar -xz -C ~/.cargo/bin

        echo "=== Validating cargo-binstall ==="
        cargo-binstall -V

        echo "=== Installing bpf-linker via cargo-binstall ==="
        cargo-binstall --strategies quick-install --no-confirm bpf-linker

        echo "=== Validating bpf-linker ==="
        bpf-linker --version

    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Phase 1.1 - Verify sg-common Core (Kernel Target)
      run: |
        CARGO_PROFILE_RELEASE_LTO=false \
        RUSTFLAGS="-C embed-bitcode=yes -C lto=no" \
        cargo check -Z build-std=core --target bpfel-unknown-none -p sg-common

    - name: Phase 1.2 - Verify sg-common Userspace Bindings
      run: cargo check --target x86_64-unknown-linux-gnu -p sg-common

    - name: Phase 2.1 - Compile Kernel eBPF Bytecode
      run: |
        CARGO_PROFILE_RELEASE_LTO=false \
        RUSTFLAGS="-C embed-bitcode=yes -C lto=no" \
        cargo build -Z build-std=core --target bpfel-unknown-none -p sg-ebpf

    - name: Phase 2.2 - Audit Stack Frame Size (INV-05 Compliance)
      run: |
        SYSROOT=$(rustc --print sysroot)
        LLVM_OBJDUMP=$(find "$SYSROOT/lib/rustlib/x86_64-unknown-linux-gnu/bin/" \
                            -name "llvm-objdump" -type f 2>/dev/null | head -n 1)

        if [ -z "$LLVM_OBJDUMP" ]; then
          echo "ERROR: llvm-objdump not found in rustlib sysroot. Check llvm-tools-preview component."
          exit 1
        fi

        echo "=== Using: $LLVM_OBJDUMP ==="
        echo "=== Building release eBPF object for audit ==="
        
        CARGO_PROFILE_RELEASE_LTO=false \
        RUSTFLAGS="-C embed-bitcode=yes -C lto=no" \
        cargo build --release -Z build-std=core --target bpfel-unknown-none -p sg-ebpf

        TARGET_BIN=$(find target/bpfel-unknown-none/release/ \
                          -name "sg-ebpf" -type f 2>/dev/null | head -n 1)

        if [ -z "$TARGET_BIN" ]; then
          echo "ERROR: eBPF binary not found under target/bpfel-unknown-none/release/"
          exit 1
        fi

        echo "=== Auditing eBPF Stack Frame — xdp_ingress (INV-05: must be ≤ 512B) ==="
        "$LLVM_OBJDUMP" -d "$TARGET_BIN" | grep -A2 "xdp_ingress" || true

    - name: Phase 3.1 - Verify Userspace Capture Daemon
      run: cargo check --target x86_64-unknown-linux-gnu -p sg-capture

    - name: Phase 3.2 - Run Test Suite (Post-Init Assertions)
      run: cargo test -p sg-capture -p sg-common --target x86_64-unknown-linux-gnu -- --nocapture

    - name: Enforce Strict Code Formatting (rustfmt)
      run: cargo fmt --all -- --check

    - name: Enforce Zero-Tolerance Linting (clippy)
      run: |
        CARGO_PROFILE_RELEASE_LTO=false \
        RUSTFLAGS="-C embed-bitcode=yes -C lto=no" \
        cargo clippy --workspace --all-targets -- -D warnings -A clippy::useless_transmute -A clippy::ptr_offset_with_cast -A clippy::too_many_arguments -A clippy::question_mark
